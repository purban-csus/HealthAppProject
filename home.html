<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Home</title>
		<script src="modernizr-1.5.js"></script>
		<link href="/style.css" rel="stylesheet" />
	</head>
	
	<body>
		<!--content container for the main box-->
		<div class="content">
			
			<h1>Home</h1>
			
			<!--content container that holds the green boxes-->
			<div class="user_layout">
				
				<!--content in green boxes-->
				<div class="user_data">					
					
					<h1>Calories Today</h1>
					<img class="home-figure" src="/images/calories.png" alt="Broccoli Calories">
					
					<!--content in orange boxes-->
					<div class="user-data-box">
						<p>1600</p>
					</div>
					
				</div>
				<!--content in green boxes-->
				<div class="user_data">					
					
					<h1>Steps Today</h1>
					<img class="home-figure" src="/images/steps.png" alt="Carrot Steps">
					
					<!--content in orange boxes-->
					<div class="user-data-box">
						<p>37</p>
					</div>
					
				</div>				
				
			</div>
					
		</div>	
	
	</body>
	
</html>
