<!DOCTYPE html>
<html lang="en">
	<!--scale the page to the decive width and reference the stylesheet-->
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Login</title>
		<script src="modernizr-1.5.js"></script>
		<link href="/style.css" rel="stylesheet" />
	</head>

	<body>		
		<!--the .content is scaled to fit the screen on all devices in the CSS file-->
		<div class="content">
			<h1>BetterU</h1>
			<!--container that holds both the login forms and the image beside it-->
			<div class="login-layout">
				<!--login forms are kept seperate from the image so they can be next to one another instead of above and below-->
				<div class="login-forms">					
					<h1>Log In</h1>
					<!--buttons and input boxes to be checked agains the database-->
					<form id="loginForm">
						<!--the user name-->
						<label for="loginUsername">Username:</label>
						<input type="text" id="loginUsername" required>
						<!--the password-->
						<label for="loginPassword">Password:</label>
						<input type="password" id="loginPassword" required>
						<!--the submit button-->
						<button type="submit">Submit</button>
					</form>	
				</div>
				<!--image next to the login forms-->
				<img class="login-figure" src="/images/login.png" alt="Broccoli Bob">
			</div>
			
			<br><br>
			
			<!--container that holds both the login forms and the image beside it-->
			<div class="login-layout">
				<!--container for the register button and text-->
				<div class="login-forms">
					<section>
						<h2>Register</h2>
						<!--link button to registration page-->
						<button type="button" onclick="window.location.href='/register'">Create Account</button>
					</section>
				</div>
				<!--image next to the register button-->
				<img class="register-figure" src="/images/register.png" alt="Broccoli Register">
			</div>
		</div>
		<p id="message"></p>
	</body>

</html>
