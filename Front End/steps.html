<!--This is the page where users enter their steps-->

<!DOCTYPE html>
<html lang="en">
	<!--scale the page to the decive width and reference the stylesheet-->
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Steps</title>
		<script src="modernizr-1.5.js"></script>
		<link href="/style.css" rel="stylesheet" />
	</head>

	<!--Content box for entering the steps-->
	<body>
		<div class="content">
			<h1>Enter Steps</h1>
			<p>Enter the steps you want to add.</p>
			<form id="stepsForm">
				<input type="number" id="stepsInput" min="0" required>
				<button type="submit">Save Steps</button>
			</form>

			<!--place for any messages that are returned-->
			<p id="message"></p>
			
		</div>
	
		<!--java script for communicating with the Python API-->
		<script>
		document
			.getElementById("stepsForm")
			.addEventListener("submit", async function(event) 
			{
				event.preventDefault();

				<!--variable for storing the steps entered by user-->
				const steps = Number(document.getElementById("stepsInput").value);

				<!--sends the calories to the API and waits for a response-->
				const response = await fetch("/api/steps", 
				{
					method: "POST",
					headers: 
					{
						"Content-Type": "application/json"
					},
					credentials: "same-origin",
					body: JSON.stringify
					({
						steps: steps
					})
				});

				<!--if the response was successful, then redirect to home page, if failed, display message from response-->
				const data = await response.json();

				if (data.success) 
				{
					window.location.href = "/home";
				}
				else
				{
					document.getElementById("message").textContent = data.message;
				}
			});
		</script>
	
	</body>
	
</html>
