<!--This is the page wehre users can create an account-->

<!DOCTYPE html>
<html lang="en">
	<!--scale the page to the decive width and reference the stylesheet-->
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Create Account</title>
		<script src="modernizr-1.5.js"></script>
		<link href="/style.css" rel="stylesheet" />
	</head>

	<body>
		<!--the .content is scaled to fit the screen on all devices in the CSS file-->
		<div class="content">
			<h1>Create an Account</h1>

			<section>
				<h2>Do not use real passwords!</h2>
				<form id="registerForm">
					<!--forms for creating new account that are passed to the SQL database for storage-->
					<label for="registerUsername">Username:</label>
					<input type="text" id="registerUsername" required>
					<br><br>
					<label for="registerPassword">Password:</label>
					<input type="password" id="registerPassword" required>
					<br><br>
					<button type="submit">Submit</button>
					<br><br>
					<!--link to return to the login page-->
					<a href="/login">Back to login</a>					
				</form>
			</section>
			
		</div>
		<p id="message"></p>
		
		<!--java script for communicating with the Python API-->
		<script>
			document
				.getElementById("registerForm")
				.addEventListener("submit", async function(event) 
				{
					event.preventDefault();
					
					<!--variables for storing the login and password entered by user-->
					const username = document.getElementById("registerUsername").value;
					const password = document.getElementById("registerPassword").value;
					
					<!--sends the login and pass to the API and waits for a response-->
					const response = await fetch("/api/register", 
					{
						method: "POST",
						headers: 
						{
							"Content-Type": "application/json"
						},
						body: JSON.stringify
						({
							username: username,
							password: password
						})
					});
					
					<!--if the response was successful, then redirect to login page, if failed, display message from response-->
					const data = await response.json();
					
					if (data.success)
					{
						window.location.href = "/login";
					}
					else
					{
						document.getElementById("message").textContent = data.message;
					}
				});

		</script>
		
	</body>

</html>
