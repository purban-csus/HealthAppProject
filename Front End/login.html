<!--This is the login page-->

<!DOCTYPE html>
<html lang="en">
	<!--scale the page to the decive width and reference the stylesheet-->
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Login</title>
		<script src="modernizr-1.5.js"></script>
		<link href="/style.css" rel="stylesheet" />
	</head>

	<body>		
		<!--the .content is scaled to fit the screen on all devices in the CSS file-->
		<div class="content">
			<div class="login-box">
				<h1>BetterU</h1>
				<!--container that holds both the login forms and the image beside it-->
				<div class="login-layout">
					<!--login forms are kept seperate from the image so they can be next to one another instead of above and below-->
					<div class="login-forms">					
						<h1>Log In</h1>
						<!--buttons and input boxes to be checked agains the database-->
						<form id="loginForm">
							<!--the user name-->
							<label for="loginUsername">Username:</label>
							<input type="text" id="loginUsername" required>
							<!--the password-->
							<label for="loginPassword">Password:</label>
							<input type="password" id="loginPassword" required>
							<p id="message"></p>
							<!--the submit button-->
							<button type="submit">Submit</button>
						</form>	
					</div>
					<!--image next to the login forms-->
					<img class="login-figure" src="/images/login.png" alt="Broccoli Bob">
				</div>
				
				<br><br>
				
				<!--container that holds both the login forms and the image beside it-->
				<div class="login-layout">
					<!--container for the register button and text-->
					<div class="login-forms">
						<section>
							<h2>Register</h2>
							<!--link button to registration page-->
							<button type="button" onclick="window.location.href='/register'">Create Account</button>
						</section>
					</div>
					<!--image next to the register button-->
					<img class="register-figure" src="/images/register.png" alt="Broccoli Register">
				</div>
			</div>
		</div>
		<p id="message"></p>
	
	
		<!--java script for communicating with the Python API-->
		<script>
			document
				.getElementById("loginForm")
				.addEventListener("submit", async function(event) 
				{
					event.preventDefault();

					<!--variables for storing the login and password entered by user-->
					const username = document.getElementById("loginUsername").value;
					const password = document.getElementById("loginPassword").value;

					<!--sends the login and pass to the API and waits for a response-->
					const response = await fetch("/api/login", 
					{
						method: "POST",
						headers: 
						{
							"Content-Type": "application/json"
						},
						credentials: "same-origin",
						body: JSON.stringify
						({
							username: username,
							password: password
						})
					});

					<!--if the response was successful, then redirect to home page, if failed, display message from response-->
					const data = await response.json();

					if (data.success) 
					{
						window.location.href = "/home.html";
					} 
					else 
					{
						document.getElementById("message").textContent = data.message;
					}
				});
			
		</script>
	
	</body>

</html>
